<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nurturing Dashboard · Alta</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e4e7ec;--ac:#4f46e5;--wa:#16a34a;--em:#2563eb;--mk:#d97706;--ut:#0891b2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--mu:#98a2b3;--bd:#2a2f38;--ac:#818cf8}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:20px 24px 0}h1{margin:0;font-size:20px}.sub{color:var(--mu);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:14px 24px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}.k b{font-size:22px;display:block}.k span{color:var(--mu);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 10px;align-items:center}
select,input{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;font:inherit}
nav{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--bd);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--mu);font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{padding:18px 24px 40px}.hide{display:none}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);margin-right:4px}
.Both{color:var(--ac)}.WhatsApp{color:var(--wa)}.Email{color:var(--em)}.Marketing{color:var(--mk)}.Utility{color:var(--ut)}
.tl{position:relative;margin-left:8px;padding-left:22px;border-left:2px solid var(--bd)}
.step{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:12px;cursor:pointer}
.step:before{content:"";position:absolute;left:-30px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:2px solid var(--bg)}
.step.Manual:before{background:var(--mk)}.step h3{margin:0 0 4px;font-size:14px}.when{font-weight:600}.mu{color:var(--mu);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}.card h4{margin:0 0 10px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.row .l{width:120px;flex:none}.row .b{height:14px;border-radius:4px;background:var(--ac)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top;font-size:13px}th{color:var(--mu);font-weight:600;background:var(--bg)}
.scroll{overflow-x:auto}tr.c{cursor:pointer}tr.c:hover td{background:var(--bg)}
.pv{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.wa{background:#dcf8c6;color:#111;border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:13.5px}
.mail{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;white-space:pre-wrap;font-size:13.5px}
.mail .s{font-weight:700;border-bottom:1px solid var(--bd);padding-bottom:8px;margin-bottom:10px;white-space:normal}
.rules{display:grid;gap:10px}.rule{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.rule b{display:block;margin-bottom:2px}
.flow{display:flex;gap:6px;overflow-x:auto;padding:6px 0 14px}.node{flex:none;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:12px;text-align:center;min-width:92px}.node i{display:block;color:var(--mu);font-style:normal}.arr{align-self:center;color:var(--mu)}
.fl{display:flex;gap:8px;flex-wrap:wrap}.dd{position:relative}.dd summary{list-style:none;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}.dd summary::-webkit-details-marker{display:none}.dd summary:after{content:" ▾";color:var(--mu)}
.pop{position:absolute;z-index:5;top:100%;left:0;margin-top:4px;min-width:200px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.pop label{display:flex;gap:8px;align-items:center;padding:5px 6px;cursor:pointer;border-radius:6px}.pop label:hover{background:var(--bg)}
.acts{display:flex;gap:12px;padding:4px 6px 6px;border-bottom:1px solid var(--bd);margin-bottom:4px}.acts a{color:var(--ac);cursor:pointer;font-size:12.5px}
</style></head><body>
<header><h1>Nurturing Dashboard</h1><div class="sub">Alta School of Technology · Ads Nurturing plan · kaun sa message, kis stage pe, kitne time pe · <span id="st"></span> <button id="rf" style="border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:2px 8px;cursor:pointer">↻ Refresh</button></div></header>
<div class="kpis" id="kpis"></div>
<div class="bar">
<div id="fl" class="fl"></div>
<input id="q" placeholder="Search subject / message…" style="min-width:200px">
</div>
<nav id="nav"></nav>
<main>
<section id="v0"></section><section id="v1" class="hide"></section><section id="v2" class="hide"></section>
<section id="v3" class="hide"></section><section id="v4" class="hide"></section><section id="v5" class="hide"></section>
</main>

in Computer Science is AI-first: you learn core CS and how it's used to build real AI products.\n\nA 2-minute overview of the program: [Program Link]\n\nGot a question? Just reply and we'll help.\n\n[Button: See the program]\n\nTeam Alta", "CTA / Link": "See the program - [Program Link]", "Creative / Graphic Idea": "One simple visual of the program highlights, using only points the program team has verified.", "Why This Message": "An hour after registering the student is still curious and has the ad in mind. The first thing they want to know is what the course really covers.", "Stop Sending When": "Application started, or the student opts out.", "Next Message": "Nurturing 3"}, {"Stage": "Lead", "Sub-Stage": "Application Not Started", "Condition / If-Else": "Application Started = No", "Lead / Application": "Leads", "Timeline": "After 24 Hours", "Email or WhatsApp": "Both", "Trigger": "Automatic", "Nurturing #": "Nurturing 3", "Message Type": "Marketing", "WhatsApp Message": "Hi [First Name], one thing students often ask is, 'Will it all be theory?'\nAt Alta you learn by building. Projects start early and you get feedback from mentors along the way. Here's the kind of projects students work on: [Projects Link]", "Email Subject": "Will it all be theory? Here's what students build", "Email Body": "Hi [First Name],\n\nOne thing students often ask is, 'Will it all be theory?'\n\nAt Alta you learn by building. Projects start early and you get feedback from mentors along the way. Here's the kind of projects students work on: [Projects Link]\n\n[Button: See student projects]\n\nTeam Alta", "CTA / Link": "See student projects - [Projects Link]", "Creative / Graphic Idea": "Carousel of 3 verified student projects, each with the project name and one line about it.", "Why This Message": "By day two the student is comparing options and worried about practical learning. Real projects answer that better than a feature list.", "Stop Sending When": "Application started, or the student opts out.", "Next Message": "Nurturing 4"}, {"Stage": "Lead", "Sub-Stage": "Application Not Started", "Condition / If-Else": "Application Started = No", "Lead / Application": "Leads", "Timeline": "After 72 Hours", "Email or WhatsApp": "Both", "Trigger": "Automatic", "Nurturing #": "Nurturing 4", "Message Type": "Marketing", "WhatsApp Message": "Hi [First Name], choosing a college comes with a lot of questions. Here are the ones we hear most:\n1 - Who will teach me, and who will guide me?\n2 - What are the fees and scholarships?\n3 - What careers does this lead to?\nReply 1, 2 or 3 and we'll send a clear answer.", "Email Subject": "The questions students ask us most", "Email Body": "Hi [First Name],\n\nChoosing a college comes with a lot of questions. These are the ones we hear most from students:\n\n- Who will teach me, and who will guide me?\n- What are the fees and scholarships?\n- What careers does this lead to?\n\nWe've answered them in one place. If you'd rather talk it through, just reply and a counsellor will call you.\n\n[Button: Read the answers]\n\nTeam Alta", "CTA / Link": "Reply 1, 2 or 3 - or read the answers: [FAQ Link]", "Creative / Graphic Idea": "Simple FAQ card with the three questions.", "Why This Message": "By day three most students have a doubt that stops them. Naming the common doubts makes it easy to ask, and replies are easy to measure.", "Stop Sending When": "Application started, or the student opts out.", "Next Message": "Nurturing 5"}, {"Stage": "Lead", "Sub-Stage": "Application Not Started", "Condition / If-Else": "Application Started = No", "Lead / Application": "Leads", "Timeline": "After 1 Week", "Email or WhatsApp": "WhatsApp", "Trigger": "Automatic", "Nurturing #": "Nurturing 5", "Message Type": "Marketing", "WhatsApp Message": "Hi [First Name], many students want to know where a B.Tech like this can lead. Here's a straightforward look at career paths and placement support: [Careers Link]\nIf you'd like to talk it through, reply YES and a counsellor will call you at a time that suits you.", "Email Subject": "N/A - WhatsApp only in the plan", "Email Body": "N/A - WhatsApp only in the plan", "CTA / Link": "See career paths - [Careers Link]", "Creative / Graphic Idea": "Simple career paths graphic with verified information only. No placement numbers unless approved.", "Why This Message": "A week in, the student is weighing outcomes. Honest career information and a human option work better than another reminder.", "Stop Sending When": "Application started, or the student opts out. Also stop if the student replies YES (counsellor takes over).", "Next Message": "Nurturing 6"}, {"Stage": "Lead", "Sub-Stage": "Application Not Started", "Condition / If-Else": "Application Started = No", "Lead / Application": "Leads", "Timeline": "Before 5 Days Deadline", "Email or WhatsApp": "Both", "Trigger": "Manual", "Nurturing #": "Nurturing 6", "Message Type": "Marketing", "WhatsApp Message": "Hi [First Name], applications for the [Batch] batch close on [Deadline Date], 5 days from now.\nIf you're still interested, the first step is just your basic details: [Application Link]\nNeed help with anything? Reply here.", "Email Subject": "Applications close on [Deadline Date]", "Email Body": "Hi [First Name],\n\nApplications for the [Batch] batch close on [Deadline Date], 5 days from now.\n\nIf you're still interested, the first step is just your basic details: [Application Link]\n\nNeed help with anything? Reply to this email.\n\n[Button: Start application]\n\nTeam Alta", "CTA / Link": "Start application - [Application Link]", "Creative / Graphic Idea": "None needed.", "Why This Message": "A real deadline with a small first step. The message offers help instead of pressure.", "Stop Sending When": "Application started (cancel any pending deadline messages), or the student opts out.", "Next Message": "Nurturing 7"}, {"Stage": "Lead", "Sub-Stage": "Application Not Started", "Condition / If-Else": "Application Started = No", "Lead / Application": "Leads", "Timeline": "Before 3 Days Deadline", "Email or WhatsApp": "Both", "Trigger": "Manual", "Nurturing #": "Nurturing 7", "Message Type": "Marketing", "WhatsApp Message": "Hi [First Name], 3 days left to apply for the [Batch] batch (closes on [Deadline Date]).\nIf something is holding you back, tell us. We can usually sort it out quickly.\nTo apply: [Application Link]", "Email Subject": "3 days left to apply", "Email Body": "Hi [First Name],\n\n3 days left to apply for the [Batch] batch (closes on [Deadline Date]).\n\nIf something is holding you back, tell us. We can usually sort it out quickly.\n\nTo apply: [Application Link]\n\n[Button: Start application]\n\nTeam Alta", "CTA / Link": "Start application - [Application Link]", "Creative / Graphic Idea": "None needed.", "Why This Message": "Invites the real reason for hesitation to come out.", "Stop Sending When": "Application started (cancel any pending deadline messages), or the student opts out.", "Next Message": "Nurturing 8"}, {"Stage": "Lead", "Sub-Stage": "Application Not Started", "Condition / If-Else": "Application Started = No", "Lead / Application": "Leads", "Timeline": "Before 12 Hours Deadline", "Email or WhatsApp": "Both", "Trigger": "Manual", "Nurturing #": "Nurturing 8", "Message Type": "Marketing", "WhatsApp Message": "Hi [First Name], applications close in 12 hours, at [Deadline Time] on [Deadline Date].\nYou can still apply here: [Application Link]\nStuck on anything? Reply HELP and our team will reach out.", "Email Subject": "Applications close in 12 hours", "Email Body": "Hi [First Name],\n\nApplications close in 12 hours, at [Deadline Time] on [Deadline Date].\n\nYou can still apply here: [Application Link]\n\nStuck on anything? Reply HELP and our team will reach out.\n\n[Button: Start application]\n\nTeam Alta", "CTA / Link": "Start application - [Application Link]", "Creative / Graphic Idea": "None needed.", "Why This Message": "Last-day clarity with a help option.", "Stop Sending When": "Application started (cancel any pending deadline messages), or the student opts out.", "Next Message": "Nurturing 9"}, {"Stage": "Lead", "Sub-Stage": "Application Not Started", "Condition / If-Else": "Application Started = No", "Lead / Application": "Leads", "Timeline": "Before 1 Hour Deadline", "Email or WhatsApp": "WhatsApp", "Trigger": "Manual", "Nurturing #": "Nurturing 9", "Message Type": "Marketing", "WhatsApp Message": "Hi [First Name], applications close at [Deadline Time] today. If you'd like to apply, here's the link: [Application Link]", "Email Subject": "N/A - WhatsApp only in the plan", "Email Body": "N/A - WhatsApp only in the plan", "CTA / Link": "Start application - [Application Link]", "Creative / Graphic Idea": "None needed.", "Why This Message": "A final, short prompt. WhatsApp is the only channel fast enough.", "Stop Sending When": "Application started (cancel any pending deadline messages), or the student opts out.", "Next Message": "Application started: see Nurturing 9.1 and onwards"}];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const F={ch:'Email or WhatsApp',tr:'Trigger',ty:'Message Type',st:'Sub-Stage'};
const uniq=k=>[...new Set(D.map(r=>r[k]))];
const FL=[['ch','Channel'],['tr','Trigger'],['ty','Type'],['st','Sub-stage']],V={},S={};
function buildFilters(){FL.forEach(([k])=>{V[k]=uniq(F[k]);S[k]=new Set(V[k])});
$('#fl').innerHTML=FL.map(([k,l])=>`<details class="dd" data-k="${k}"><summary></summary><div class="pop"><div class="acts"><a data-a="all">Select all</a><a data-a="none">Clear all</a></div>${V[k].map((v,i)=>`<label><input type="checkbox" data-i="${i}" checked> ${esc(v)}</label>`).join('')}</div></details>`).join('');sync()}
function sync(){FL.forEach(([k,l])=>{const d=document.querySelector(`.dd[data-k="${k}"]`);d.querySelector('summary').textContent=`${l}: ${S[k].size===V[k].length?'All':S[k].size===0?'None':S[k].size+' of '+V[k].length}`;d.querySelectorAll('input').forEach((c,i)=>c.checked=S[k].has(V[k][i]))})}
$('#fl').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;const k=e.target.closest('.dd').dataset.k;S[k]=new Set(a==='all'?V[k]:[]);sync();render()});
$('#fl').addEventListener('change',e=>{const k=e.target.closest('.dd').dataset.k,v=V[k][+e.target.dataset.i];e.target.checked?S[k].add(v):S[k].delete(v);sync();render()});
document.addEventListener('click',e=>document.querySelectorAll('.dd[open]').forEach(d=>{if(!d.contains(e.target))d.removeAttribute('open')}));
buildFilters();
const tabs=['Journey','Timing','Channel & Trigger','Content table','Message preview','Rules & flow'];
$('#nav').innerHTML=tabs.map((t,i)=>`<button data-i="${i}" class="${i?'':'on'}">${t}</button>`).join('');
let sel=0;
const isNA=s=>/^N\/A/i.test(s||'');
function rows(){const q=$('#q').value.toLowerCase();
 return D.filter(r=>FL.every(([k])=>S[k].has(r[F[k]]))&&(!q||(r['Email Subject']+r['WhatsApp Message']+r['Email Body']).toLowerCase().includes(q)))}
const tags=r=>`<span class="tag ${r['Email or WhatsApp']}">${esc(r['Email or WhatsApp'])}</span><span class="tag ${r['Message Type']}">${esc(r['Message Type'])}</span><span class="tag">${esc(r['Trigger'])}</span>`;
function bars(obj,col){const m=Math.max(...Object.values(obj),1);return Object.entries(obj).map(([k,v])=>`<div class="row"><div class="l">${esc(k)}</div><div class="b" style="width:${v/m*140+6}px;${col?'background:'+col:''}"></div><b>${v}</b></div>`).join('')}
const cnt=(R,fn)=>R.reduce((a,r)=>{const k=fn(r);a[k]=(a[k]||0)+1;return a},{});
function render(){const R=rows();
 const em=R.filter(r=>!isNA(r['Email Subject'])).length,wa=R.filter(r=>!isNA(r['WhatsApp Message'])).length;
 $('#kpis').innerHTML=[['Messages',R.length],['Email',em],['WhatsApp',wa],['Automatic',R.filter(r=>r.Trigger==='Automatic').length],['Manual',R.filter(r=>r.Trigger==='Manual').length],['Marketing',R.filter(r=>r['Message Type']==='Marketing').length]].map(([a,b])=>`<div class="k"><b>${b}</b><span>${a}</span></div>`).join('');
 // 0 journey
 $('#v0').innerHTML=R.length?`<div class="tl">${R.map(r=>`<div class="step ${r.Trigger}" onclick="go('${r['Nurturing #']}')"><div class="when">${esc(r.Timeline)}</div><h3>${esc(r['Nurturing #'])} · ${esc(r['Email Subject'].startsWith('N/A')?'(WhatsApp only)':r['Email Subject'])}</h3><div>${tags(r)}</div><div class="mu" style="margin-top:6px">${esc(r['Sub-Stage'])} · ${esc(r['Condition / If-Else'])}</div></div>`).join('')}</div>`:'<p class="mu">Kuch match nahi hua.</p>';
 // 1 timing
 const post=R.filter(r=>!/Deadline/i.test(r.Timeline)),pre=R.filter(r=>/Deadline/i.test(r.Timeline));
 const blk=(t,a)=>`<div class="card"><h4>${t}</h4>${a.map(r=>`<div class="row"><div class="l" style="width:170px"><b>${esc(r.Timeline)}</b></div><span>${esc(r['Nurturing #'])}</span><span class="tag ${r['Email or WhatsApp']}">${esc(r['Email or WhatsApp'])}</span></div>`).join('')||'<span class="mu">—</span>'}</div>`;
 $('#v1').innerHTML=`<div class="grid">${blk('Registration ke baad (lead created se)',post)}${blk('Deadline se pehle (countdown)',pre)}</div>`;
 // 2 channel
 $('#v2').innerHTML=`<div class="grid"><div class="card"><h4>By channel</h4>${bars(cnt(R,r=>r['Email or WhatsApp']))}</div><div class="card"><h4>By trigger</h4>${bars(cnt(R,r=>r.Trigger),'var(--mk)')}</div><div class="card"><h4>By type</h4>${bars(cnt(R,r=>r['Message Type']),'var(--ut)')}</div><div class="card"><h4>By sub-stage</h4>${bars(cnt(R,r=>r['Sub-Stage']),'var(--wa)')}</div></div>
 <div class="card scroll" style="margin-top:12px"><h4>Channel × Trigger matrix</h4><table><tr><th></th>${uniq(F.tr).map(t=>`<th>${t}</th>`).join('')}</tr>${uniq(F.ch).map(c=>`<tr><th>${c}</th>${uniq(F.tr).map(t=>`<td>${R.filter(r=>r[F.ch]===c&&r.Trigger===t).length}</td>`).join('')}</tr>`).join('')}</table></div>`;
 // 3 table
 $('#v3').innerHTML=`<div class="scroll"><table><tr><th>#</th><th>Timeline</th><th>Channel</th><th>Trigger</th><th>Type</th><th>Email subject</th><th>CTA</th></tr>${R.map(r=>`<tr class="c" onclick="go('${r['Nurturing #']}')"><td><b>${esc(r['Nurturing #'].replace('Nurturing ','N'))}</b></td><td>${esc(r.Timeline)}</td><td class="${r['Email or WhatsApp']}">${esc(r['Email or WhatsApp'])}</td><td>${esc(r.Trigger)}</td><td class="${r['Message Type']}">${esc(r['Message Type'])}</td><td>${esc(r['Email Subject'])}</td><td>${esc(r['CTA / Link'])}</td></tr>`).join('')}</table></div>`;
 // 4 preview
 if(!R.find(r=>r['Nurturing #']===sel))sel=R[0]?R[0]['Nurturing #']:null;
 const c=R.find(r=>r['Nurturing #']===sel);
 $('#v4').innerHTML=`<div class="bar" style="padding:0 0 12px"><select onchange="sel=this.value;render()">${R.map(r=>`<option ${r['Nurturing #']===sel?'selected':''} value="${r['Nurturing #']}">${r['Nurturing #']} — ${esc(r.Timeline)}</option>`).join('')}</select></div>`+(c?`<div class="mu" style="margin-bottom:10px">${tags(c)} · ${esc(c.Timeline)}</div><div class="pv"><div><h4 class="mu">WhatsApp</h4>${isNA(c['WhatsApp Message'])?'<div class="mu">Nahi jaata</div>':`<div class="wa">${esc(c['WhatsApp Message'])}</div>`}</div><div><h4 class="mu">Email</h4>${isNA(c['Email Subject'])?'<div class="mu">Nahi jaata</div>':`<div class="mail"><div class="s">${esc(c['Email Subject'])}</div>${esc(c['Email Body'])}</div>`}</div></div><div class="grid" style="margin-top:14px"><div class="card"><h4>CTA</h4>${esc(c['CTA / Link'])}</div><div class="card"><h4>Creative idea</h4>${esc(c['Creative / Graphic Idea'])}</div><div class="card"><h4>Why this message</h4>${esc(c['Why This Message'])}</div></div>`:'');
 // 5 rules
 $('#v5').innerHTML=`<div class="flow">${R.map((r,i)=>(i?'<span class="arr">→</span>':'')+`<div class="node"><b>${r['Nurturing #'].replace('Nurturing ','N')}</b><i>${esc(r.Timeline)}</i></div>`).join('')}</div><div class="rules">${R.map(r=>`<div class="rule"><b>${esc(r['Nurturing #'])} — stop when</b>${esc(r['Stop Sending When'])}<div class="mu" style="margin-top:4px">Next: ${esc(r['Next Message'])}</div></div>`).join('')}</div>`;
}
function go(n){sel=n;render();show(4)}
function show(i){document.querySelectorAll('main section').forEach((s,j)=>s.classList.toggle('hide',j!==i));document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',j===i))}
$('#nav').onclick=e=>{if(e.target.dataset.i)show(+e.target.dataset.i)};
